packages:
  - "apps/*"

allowBuilds:
  core-js: true
  esbuild: true
  msw: true

# pnpm's release-age gate, in minutes (24 hours). It matches pnpm's default, but it's set explicitly
# so the policy is visible and doesn't change silently. Setting it explicitly also turns on strict mode
# by default. minimumReleaseAgeStrict: false keeps pnpm's default behavior: when no version is old
# enough, pnpm falls back to a younger one instead of failing the install.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
