name: Changesets

# Pnpm setup based on https://github.com/pnpm/action-setup#use-cache-to-reduce-installation-time

on:
  push:
    branches: ["main"]
env:
  CI: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC for npm Trusted Publishing
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        id: cache-turborepo-restore
        uses: actions/cache/restore@v5
        with:
          # Using SHA will usually provide cache hit on subsequent commits in a PR
          # but will not provide cache hits between PRs, meaning the first run of a PR
          # will usually only be cache misses.
          key: ${{ runner.os }}-turbo-changeset-v11-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-changeset-v11-
            ${{ runner.os }}-turbo-v11-
          path: .turbo

      - name: Build packages
        run: pnpm build-pkg

      - name: Save Turborepo cache
        id: cache-turborepo-save
        if: always() && steps.cache-turborepo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.cache-turborepo-restore.outputs.cache-primary-key }}
          path: .turbo

      - name: Create release Pull Request or publish to NPM
        # v2 is required by @changesets/cli v3, which reports published packages through
        # a CHANGESETS_OUTPUT file instead of the stdout format v1 used to parse.
        # Pinned to a commit hash because this step holds contents: write and the npm
        # trusted publishing token; changesets/action@v2 is a branch, not a tag.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          commit-message: "ci(changesets): version packages"
          pr-title: "Changeset: New Version"
          # Packages are already built by the step above; publish-pkg only runs changeset publish.
          publish-script: pnpm publish-pkg
