name: Smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "packages/**"
      - "samples/endpoints/**"
      - ".github/workflows/smoke-test.yml"
      - ".github/prompts/smoke-test.md"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      # No pnpm store cache: what this job runs must come from this commit and its lockfile.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Expose workspace binaries (e.g. agent-browser) as bare commands.
      - name: Add node_modules/.bin to PATH
        run: echo "$PWD/node_modules/.bin" >> $GITHUB_PATH

      - name: Install browser dependencies
        run: agent-browser install --with-deps

      - name: Warm up browser
        run: |
          agent-browser open about:blank
          agent-browser close

      - name: Run smoke test
        id: smoke-test
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          prompt: |
            Read and follow the instructions in .github/prompts/smoke-test.md
          allowed_bots: "claude[bot]"
          # By default the action denies the commands that run a pull request's code when its author is
          # a bot. The server then never started on the weekly dependency update pull request, and the
          # check passed without testing anything. This job already runs that code in its install step.
          restrict_untrusted_prs: "false"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          # --strict-mcp-config: load only the MCP servers the action provides, never the ones in .mcp.json.
          # --json-schema: the verdict that the next step reads.
          claude_args: >-
            --strict-mcp-config
            --max-turns 50
            --allowedTools Read,Glob,Grep,Bash(agent-browser:*),Bash(pnpm:*),Bash(curl:*),Bash(cat:*),Bash(sleep:*)
            --json-schema '{"type":"object","properties":{"passed":{"type":"boolean"},"summary":{"type":"string"}},"required":["passed","summary"]}'

      # Without this step the check is green whatever the agent found. The output is empty when the
      # action skipped itself because this file differs from main. See agent-docs/references/ci-cd.md.
      - name: Fail when the smoke test did not pass
        if: steps.smoke-test.outputs.structured_output != ''
        env:
          RESULT: ${{ steps.smoke-test.outputs.structured_output }}
        run: |
          echo "$RESULT" | jq .
          echo "$RESULT" | jq --exit-status '.passed == true' > /dev/null
