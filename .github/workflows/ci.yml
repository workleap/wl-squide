name: CI

# PNPM setup based on https://github.com/pnpm/action-setup#use-cache-to-reduce-installation-time

on:
  push:
    # Renovate only merges a renovate/* branch into main once a check passed on it. See agent-docs/references/ci-cd.md.
    branches: ["main", "renovate/**"]
  pull_request:
    branches: ["main"]

env:
  CI: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for the Turborepo Git filters.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check agent skill discovery
        # skills.sh must discover only the workleap-squide skill. See agent-docs/references/agent-skills.md.
        env:
          DISABLE_TELEMETRY: 1
        run: |
          cd "$(mktemp -d)"
          skills=$(npx -y skills@latest add "$GITHUB_WORKSPACE" --skill '*' -a claude-code --copy -y --json | jq -r '[.[].name] | sort | join(",")')
          echo "Discovered skills: $skills"
          if [ "$skills" != "workleap-squide" ]; then
              echo "::error::skills.sh must discover only the workleap-squide skill, got: $skills"
              exit 1
          fi

      - name: Restore Turborepo cache
        id: cache-turborepo-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Using SHA will usually provide cache hit on subsequent commits in a PR
          # but will not provide cache hits between PRs, meaning the first run of a PR
          # will usually only be cache misses.
          key: ${{ runner.os }}-turbo-ci-v11-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-ci-v11-
            ${{ runner.os }}-turbo-v11-
          path: .turbo

      - name: Build packages
        # For a PR, only build the packages that are diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={./packages/*}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-pkg
          fi

      - name: Build basic sample
        # For a PR, only build the sample if it's diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={./samples/basic/*}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-basic
          fi

      - name: Build endpoints sample
        # For a PR, only build the sample if it's diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={./samples/endpoints/*}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-endpoints
          fi

      - name: Build Storybook sample
        # For a PR, only build the sample if it's diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build --filter={@storybook/app}...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm build-storybook
          fi

      - name: Oxlint
        run: pnpm turbo run //#oxlint

      - name: Oxfmt
        run: pnpm turbo run //#oxfmt:check

      - name: Typecheck
        # For a PR, only typecheck the projects that are diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run typecheck --continue --filter=...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm turbo run typecheck --continue
          fi

      - name: Syncpack
        run: pnpm turbo run syncpack

      - name: Test agent tooling
        run: node --test .claude/skills/_update-skills/scripts/listSkillPins.test.ts

      - name: Test packages
        # For a PR, only test the projects that are diverging from the pull request original baseline.
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run test --continue --filter=...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm test
          fi

      - name: Save Turborepo cache
        id: cache-turborepo-save
        if: always() && steps.cache-turborepo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache-turborepo-restore.outputs.cache-primary-key }}
          path: .turbo

  agent-skill-changeset:
    # The workleap-squide skill ships in the @squide/firefly package: a skill change is only released with a changeset.
    # See agent-docs/references/agent-skills.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent, the base branch.
          fetch-depth: 2

      - name: Check that a skill change has a changeset
        run: bash .github/scripts/check-agent-skill-changeset.sh HEAD^1 agent-skills/workleap-squide=packages/firefly
