packages:
  - packages/*
  - samples/**

# pnpm's own release-age gate, in minutes (24 hours). It matches pnpm's default, but it's set explicitly
# so the policy is visible and doesn't change silently. The GitHub package firewall (.npmrc) also holds
# back new releases.
minimumReleaseAge: 1440

# Workleap's own packages skip pnpm's gate (the firewall's still applies).
minimumReleaseAgeExclude:
  - "@workleap/*"
  - "@workleap-telemetry/*"

# Also loads .pnpmfile.cjs for pnpm dlx / pnpx, which ignore the project pnpmfile. The pnpmfile keeps
# the package downloads on the GitHub package firewall, see CONTRIBUTING.md.
globalPnpmfile: .pnpmfile.cjs

overrides:
  # chokidar@4.0.3 is blocked by the package firewall (AttestationDowngradePolicy).
  "ts-checker-rspack-plugin>chokidar": 4.0.1

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  agent-browser: true
  core-js: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  netlify-cli: true
  protobufjs: true
  sharp: true
  unix-dgram: true

# Packages approved to have the agent skills they ship linked by pnpm install.
permissions:
  "@workleap/browserslist-config":
    skills: true
  "@workleap/logging":
    skills: true
  "@workleap/rsbuild-configs":
    skills: true
  "@workleap/rslib-configs":
    skills: true
  "@workleap/stylelint-configs":
    skills: true
  "@workleap/telemetry":
    skills: true
  "@workleap/typescript-configs":
    skills: true
  agent-browser:
    skills: true

# Link approved package skills into .claude/skills only, even when another .<agent>/skills dir exists
# (pnpm's default links into every existing one).
skills:
  dirs:
    - .claude/skills
