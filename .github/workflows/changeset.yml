name: Changesets

on:
  push:
    branches: ["main"]
env:
  CI: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for npm Trusted Publishing
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # This job holds the npm publishing identity, so everything it installs and builds comes from
      # this commit and the lockfile: no pnpm store or Turborepo cache is restored, and no lifecycle
      # script runs during the install. Another workflow could otherwise fill those caches.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm build-pkg

      - name: Create release Pull Request or publish to NPM
        # v2 is required by @changesets/cli v3, which reports published packages through
        # a CHANGESETS_OUTPUT file instead of the stdout format v1 used to parse.
        # Pinned to a commit hash because this step holds contents: write and the npm
        # trusted publishing token; changesets/action@v2 is a branch, not a tag.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "ci(changesets): version packages"
          pr-title: "Changeset: New Version"
          # Packages are already built by the step above; publish-pkg only runs changeset publish.
          publish-script: pnpm publish-pkg
