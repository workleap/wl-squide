packages:
  - packages/*
  - samples/**

# pnpm's own release-age gate, in minutes (24 hours). It matches pnpm's default, but it's set explicitly
# so the policy is visible and doesn't change silently.
minimumReleaseAge: 1440

# Workleap's own packages skip pnpm's gate.
minimumReleaseAgeExclude:
  - "@workleap/*"
  - "@workleap-telemetry/*"

overrides:
  # Pin to 5.4.0 — 5.6.0 leaks `extractComments` into swc-minify options, which swc rejects.
  # @workleap/webpack-configs uses TerserPlugin.swcMinify, so transitive consumers break.
  terser-webpack-plugin: 5.4.0

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  agent-browser: true
  core-js: true
  core-js-pure: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  netlify-cli: true
  protobufjs: true
  sharp: true
  unix-dgram: true

# Packages approved to have the agent skills they ship linked by pnpm install.
permissions:
  "@workleap/browserslist-config":
    skills: true
  "@workleap/logging":
    skills: true
  "@workleap/rsbuild-configs":
    skills: true
  "@workleap/rslib-configs":
    skills: true
  "@workleap/stylelint-configs":
    skills: true
  "@workleap/telemetry":
    skills: true
  "@workleap/typescript-configs":
    skills: true
  agent-browser:
    skills: true

# Link approved package skills into .claude/skills only, even when another .<agent>/skills dir exists
# (pnpm's default links into every existing one).
skills:
  dirs:
    - .claude/skills
